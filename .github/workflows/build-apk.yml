name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API base URL ending in /api
        required: false
        default: https://groceryapp-mvwz.vercel.app/api
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://groceryapp-mvwz.vercel.app/api' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate API URL
        run: |
          case "$API_BASE_URL" in
            https://*/api|https://*/api/) ;;
            *)
              echo "::error::Set API_BASE_URL to your public HTTPS API URL ending in /api."
              exit 1
              ;;
          esac

      - name: Build release APK
        run: flutter build apk --release --dart-define="API_BASE_URL=${API_BASE_URL%/}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grocery-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
